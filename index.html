<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page paint into the areas iOS reserves
         for its own UI (notch, home indicator, and apparently also the
         bottom toolbar's collapsed state) instead of stopping short of
         them -- paired with env(safe-area-inset-bottom) on the footer in
         index.scss, so its ink can actually reach that space -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- without this, iOS Safari tints its own chrome (status bar, bottom
         toolbar) using the page's background colour by default -- which is
         $soft-blue here, so the browser's own UI reads as an unwanted blue
         strip below the dark footer. $ink makes it read as a continuation
         of the footer instead. -->
    <meta name="theme-color" content="#171728" />

    <!-- fonts are self-hosted (see src/fonts.scss), so there's no
         third-party stylesheet to fetch first. these two carry the
         above-the-fold text -- the h1 and the body copy -- and preloading
         starts them immediately rather than waiting for the CSS to parse.
         crossorigin is required even same-origin: fonts are always fetched
         in CORS mode, and without it the preload is discarded and fetched
         twice -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/barlow-condensed-700-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/suse-mono-100800-latin.woff2"
      crossorigin
    />
    <title>Last.fm Match — Compare your music taste</title>
    <meta
      name="description"
      content="Compare two Last.fm listeners' top artists and tracks, see a compatibility score, and discover what music you have in common."
    />

    <!-- REPLACE the two absolute URLs below with the real domain once the
         site is deployed. og:image and og:url must be absolute -- scrapers
         fetch them without a page to resolve a relative path against, so a
         wrong host means no preview card at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lastfm-match.netlify.app/" />
    <meta property="og:title" content="Last.fm Match — Compare your music taste" />
    <meta
      property="og:description"
      content="Compare two Last.fm listeners' top artists and tracks, see a compatibility score, and discover what music you have in common."
    />
    <!-- PNG, not SVG: the scrapers behind these cards don't rasterise SVG.
         width/height let a client lay the card out before the image lands -->
    <meta property="og:image" content="https://lastfm-match.netlify.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Last.fm Match — a compatibility score ring reading 87% between two listeners."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Last.fm Match — Compare your music taste" />
    <meta
      name="twitter:description"
      content="Compare two Last.fm listeners' top artists and tracks, see a compatibility score, and discover what music you have in common."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
